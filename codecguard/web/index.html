<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>codecguard</title><style>
:root{color-scheme:dark;--bg:#080909;--panel:#101211;--line:#30332e;--text:#f0f1eb;--muted:#92958b;--gold:#f0c86e;--bad:#ff7e7e;--good:#81d8a1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:0}header{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 1160px)/2))}h1{font-size:16px}.online{color:var(--good)}main{max-width:1160px;margin:auto;padding:34px 22px 48px}.intro{display:grid;grid-template-columns:1.15fr .85fr;gap:35px;align-items:end;margin-bottom:26px}h2{font:650 36px/1.08 system-ui,sans-serif;margin:0}.intro p{margin:0;color:var(--muted)}.console{border:1px solid var(--line)}.wave{height:190px;border-bottom:1px solid var(--line);position:relative;background:linear-gradient(#0e1110 49.5%,#292d29 50%,#0e1110 50.5%)}canvas{width:100%;height:100%;display:block}.compare{display:grid;grid-template-columns:1fr 1fr}.candidate{padding:20px}.candidate+.candidate{border-left:1px solid var(--line)}.candidate header{height:auto;padding:0 0 15px;border:0}.candidate header strong{font-size:12px}.pass{color:var(--good)}.fail{color:var(--bad)}.row{display:grid;grid-template-columns:150px 1fr 70px;gap:12px;align-items:center;margin:13px 0;color:var(--muted);font-size:10px;text-transform:uppercase}.track{height:5px;background:#252924}.fill{height:100%;background:var(--gold)}.candidate.bad .fill{background:var(--bad)}.row b{text-align:right;color:var(--text);font-size:11px}.footer{border-top:1px solid var(--line);padding:13px 18px;display:flex;justify-content:space-between;color:var(--muted);font-size:10px}button{border:0;border-radius:2px;background:var(--gold);height:34px;padding:0 14px;font:700 11px inherit;color:#171205}@media(max-width:720px){main{padding:24px 14px}.intro{grid-template-columns:1fr;gap:10px}h2{font-size:28px}.compare{grid-template-columns:1fr}.candidate+.candidate{border-left:0;border-top:1px solid var(--line)}.row{grid-template-columns:112px 1fr 55px}.wave{height:145px}}
</style></head><body><header><h1>codecguard / release gate</h1><span class="online">● ffmpeg round trip</span></header><main><section class="intro"><h2>The file got smaller. Did the music survive?</h2><p>Four independent signal checks turn codec changes into a release decision you can reproduce.</p></section><section class="console"><div class="wave"><canvas id="wave"></canvas></div><div class="compare"><div class="candidate" id="release"><header><strong>RELEASE CANDIDATE</strong><b class="pass">PASS</b></header></div><div class="candidate bad" id="regression"><header><strong>STEREO-COLLAPSED BUILD</strong><b class="fail">BLOCK</b></header></div></div><div class="footer"><span>multi-resolution FFT · transient peaks · stereo energy</span><button id="run">Run gate</button></div></section></main><script>
const labels=[['snr_db','SNR','dB'],['spectral_convergence','spectrum',''],['transient_retention','transients',''],['stereo_width_error','stereo error','']];function rows(id,data){const root=document.querySelector('#'+id);root.querySelectorAll('.row').forEach(x=>x.remove());labels.forEach(([key,label,unit])=>{const value=data.metrics[key],score=key==='snr_db'?Math.min(100,value*3):key.includes('retention')?value*100:Math.max(3,100-value*100);root.insertAdjacentHTML('beforeend',`<div class="row"><span>${label}</span><i class="track"><i class="fill" style="width:${score}%"></i></i><b>${value}${unit}</b></div>`)})}function draw(){const c=document.querySelector('#wave'),d=devicePixelRatio;c.width=c.clientWidth*d;c.height=c.clientHeight*d;const x=c.getContext('2d');x.scale(d,d);x.strokeStyle='#f0c86e';x.lineWidth=1;x.beginPath();for(let i=0;i<c.clientWidth;i++){const t=i/c.clientWidth*24;const amp=(Math.sin(t*4)+.45*Math.sin(t*17))*(.35+.65*Math.pow(Math.sin(t*.43),8));const y=c.clientHeight/2+amp*c.clientHeight*.34;i?x.lineTo(i,y):x.moveTo(i,y)}x.stroke()}async function run(){const d=await fetch('/api/demo').then(r=>r.json());rows('release',d.release_candidate);rows('regression',d.regression)}document.querySelector('#run').onclick=run;draw();run();addEventListener('resize',draw);
</script></body></html>
